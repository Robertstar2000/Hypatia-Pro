<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Project Hypatia Pro | Scientific Discovery Platform</title>

    <script>
        window.process = { 
            env: { NODE_ENV: 'production' },
            version: '',
            versions: {},
            platform: 'browser',
            nextTick: function(cb) { setTimeout(cb, 0); }
        };
        window.onerror = function(msg, url, line, col, error) {
            if (msg === 'Script error.' && !url) return;
            console.error("Global Error:", msg, url, line, col, error);
        };
    </script>

    <style>
        :root {
            /* Theme Variables */
            --glass-bg: rgba(18, 20, 26, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            
            --primary-glow: #00f2fe;
            --primary-dim: rgba(0, 242, 254, 0.1);
            --secondary-glow: #4facfe;
            
            --bg-deep: #050507;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.05) 0%, transparent 35%),
                radial-gradient(circle at 85% 30%, rgba(166, 74, 255, 0.03) 0%, transparent 35%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Glass Components */
        .card, .modal-content, .dropdown-menu, .list-group-item {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border) !important;
            box-shadow: var(--glass-shadow);
        }

        .navbar {
            background: rgba(5, 5, 7, 0.9) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        /* Interactive Elements */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
            color: #000;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.8rem;
            padding: 0.6rem 1.4rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
            color: #000;
        }
        
        .form-control, .form-select {
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid var(--glass-border) !important;
            color: white !important;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: var(--primary-glow) !important;
            box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.15) !important;
        }

        /* Utility Classes */
        .text-primary-glow { color: var(--primary-glow) !important; }
        .bg-primary-glow { background-color: var(--primary-glow) !important; }
        .font-mono { font-family: var(--font-mono); }
        .ls-1 { letter-spacing: 0.05em; }

        /* Workspace Grid */
        .workspace-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }
        .sidebar-nav {
            position: sticky;
            top: 100px;
            height: fit-content;
            z-index: 100;
        }
        
        /* Mobile/Tablet Responsiveness */
        @media (max-width: 992px) {
            .workspace-container {
                display: block;
                padding: 1rem;
                gap: 1rem;
            }
            .sidebar-nav {
                position: relative;
                top: 0;
                width: 100%;
                margin-bottom: 1.5rem;
            }
        }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out; }
    </style>
<script type="importmap">
{

    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
